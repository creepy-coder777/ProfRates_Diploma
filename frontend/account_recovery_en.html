<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ProfRates — Student account recovery</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="main-styles.css">
<link rel="stylesheet" href="ui-fixes.css?v=20261107-student">
<link rel="stylesheet" href="recovery.css">
</head>
<body>
<main class="recovery-page" data-recovery-role="student" data-recovery-language="en">
  <h1>Student account recovery</h1>
  <p class="recovery-intro">Enter your email address to request a 6-digit password reset code. The response does not reveal whether the address has an account.</p>
  <form id="request-form">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" maxlength="255" required autocomplete="email">
    <button class="submit" type="submit">Get reset code</button>
    <button id="resend" class="recovery-secondary" type="button">Resend verification for an unverified account</button>
  </form>
  <form id="code-form" hidden>
    <label for="reset-code">6-digit code</label>
    <input id="reset-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
    <button class="submit" type="submit">Verify code</button>
    <button id="code-back" class="recovery-secondary" type="button">Change email / request a new code</button>
  </form>
  <form id="token-form" hidden>
    <p id="purpose" class="recovery-purpose"></p>
    <div id="password-fields">
      <label for="new-password">New password (12–128 characters)</label>
      <input id="new-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
    </div>
    <button class="submit" type="submit">Confirm</button>
  </form>
  <p id="status" class="recovery-status" role="status" aria-live="polite"></p>
  <a class="recovery-return" href="login_eng.html">Return to student sign in</a>
  <nav class="recovery-language" aria-label="Language">
    <a href="account_recovery.html" lang="hy">Հայերեն</a>
  </nav>
</main>
<script src="js_codes/api.js"></script>
<script src="js_codes/account_recovery.js?v=20261024-otp1"></script>
</body>
</html>
